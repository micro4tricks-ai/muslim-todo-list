[package]
name = "muslim-todo"
version = "1.0.0"
description = "Muslim Activity for Windows and macOS"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
# The Shamela library: download a shelf's pack and unpack it.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
zip = { version = "2", default-features = false }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# The ad blocker switched on and off in the running window (src/media.rs): the same WebView2 bindings wry uses.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation"] }
