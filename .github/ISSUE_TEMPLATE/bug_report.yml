name: 🐞 Bug report · مشكلة
description: Something doesn't work as expected · شيء لا يعمل كما ينبغي
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened? · ماذا حدث؟
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce · خطوات تكرار المشكلة
      placeholder: |
        1. Open …
        2. Click …
        3. See …
  - type: input
    id: device
    attributes:
      label: Device and browser · الجهاز والمتصفح
      placeholder: e.g. Android 14, Chrome 130 / Windows 11, Edge
  - type: dropdown
    id: lang
    attributes:
      label: Interface language · لغة الواجهة
      options: [العربية, English]
  - type: textarea
    id: shots
    attributes:
      label: Screenshots · صور
      description: Drag images here if you have any.
