name: 💡 Suggestion · اقتراح
description: An idea, new content or a correction · فكرة أو محتوى جديد أو تصحيح
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your suggestion · اقتراحك
      description: What would you like to see, and why would it help?
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Related link (optional) · رابط مرتبط (اختياري)
      description: For a new resource, please link only to free or official sources.
