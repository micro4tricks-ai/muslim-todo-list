# Every day: picks up the official channels' current live video ids (tools/refresh_live.mjs)
# and publishes live.json if one changed, then checks the outside services the site and the app
# read from (radio, live TV, recitations, tafsir, hadith, adhkar audio…). A dead link turns this
# red and GitHub sends an email; links are then fixed in live.json, with no app update.
name: Sources check

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Refresh the live video ids
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/refresh_live.mjs
          if ! git diff --quiet live.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "live.json: the channels' current live videos" live.json
            git push
            # A push made with this token starts no workflow, so publish the site directly.
            gh workflow run Website --ref main
          fi
      - run: node tools/check_sources.mjs --json sources.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sources
          path: sources.json
