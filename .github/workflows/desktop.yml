# Builds the desktop app (desktop/, Tauri) for Windows and macOS. Run it by hand to get the
# installers as artifacts; a desktop-v* tag also publishes them in a release of their own, never
# marked "latest" (the website reads the latest release for the Android app and its version).
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
    branches: [desktop]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            args: ''
          - os: macos-14
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ "$RUNNER_OS" = macOS ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi

      - name: Icons from the app's own
        run: |
          npm install --no-audit --no-fund
          npx tauri icon ../icons/icon-512.png

      - name: Build
        run: npx tauri build ${{ matrix.args }}

      # The app opens, shows the website, and is still running after a while.
      - name: Open it once (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: desktop/src-tauri/target/release
        run: |
          $p = Start-Process -FilePath .\muslim-todo.exe -PassThru
          Start-Sleep -Seconds 25
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:GITHUB_WORKSPACE\desktop-windows.png")
          $alive = -not $p.HasExited
          Write-Host "still running: $alive"
          if ($alive) { Stop-Process -Id $p.Id -Force }
          if (-not $alive) { Write-Error "The app closed by itself"; exit 1 }

      - name: Collect the installers
        run: |
          mkdir -p ../out
          if [ "$RUNNER_OS" = Windows ]; then
            cp src-tauri/target/release/bundle/nsis/*.exe ../out/Muslim-Activity-Windows-setup.exe
            cp src-tauri/target/release/bundle/msi/*.msi ../out/Muslim-Activity-Windows.msi
            cp ../desktop-windows.png ../out/ || true
          else
            cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg ../out/Muslim-Activity-macOS.dmg
          fi
          ls -la ../out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ runner.os }}
          path: out/

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true

      - name: Publish (not as the latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f desktop-windows.png
          notes="مهام المسلم للكمبيوتر — Windows: Muslim-Activity-Windows-setup.exe · macOS: Muslim-Activity-macOS.dmg"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" Muslim-Activity-* --clobber
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" Muslim-Activity-* --title "Muslim Activity for desktop $GITHUB_REF_NAME" --notes "$notes" --latest=false
          fi
