# Builds the desktop app (desktop/, Tauri) for Windows and macOS. Run it by hand to get the
# installers as artifacts; a desktop-v* tag also publishes them in a release of their own, never
# marked "latest" (the website reads the latest release for the Android app and its version).
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            args: ''
          - os: macos-14
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ "$RUNNER_OS" = macOS ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi

      - name: Icons (desktop/icon.svg)
        run: |
          npm install --no-audit --no-fund
          npx tauri icon icon.svg

      # The optional ad blocker shipped with the Windows app: uBlock Origin Lite (GPL-3.0), unchanged.
      - name: Ad blocker (Windows)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
          UBOL: '2026.1012.1545'
        run: |
          gh release download "$UBOL" --repo uBlockOrigin/uBOL-home --pattern '*.edge.zip' --dir "$RUNNER_TEMP"
          mkdir -p src-tauri/extensions/ubol
          unzip -q "$RUNNER_TEMP"/uBOLite_*.edge.zip -d src-tauri/extensions/ubol
          test -f src-tauri/extensions/ubol/manifest.json

      # Signed for the app's own updates (key in muslim-todo-keystore); a desktop-vX.Y.Z tag sets the version.
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ver=1.0.0
          case "$GITHUB_REF" in refs/tags/desktop-v*) ver="${GITHUB_REF_NAME#desktop-v}" ;; esac
          npx tauri build ${{ matrix.args }} -c "{\"version\":\"$ver\"}"

      # The app opens, shows the website, and is still running after a while.
      - name: Open it once (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: desktop/src-tauri/target/release
        run: |
          $p = Start-Process -FilePath .\muslim-todo.exe -PassThru
          Start-Sleep -Seconds 25
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:GITHUB_WORKSPACE\desktop-windows.png")
          $alive = -not $p.HasExited
          Write-Host "still running: $alive"
          if ($alive) { Stop-Process -Id $p.Id -Force }
          if (-not $alive) { Write-Error "The app closed by itself"; exit 1 }

      # An ad address loads with the blocker off and is refused with it on.
      - name: Ad blocker works (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: desktop/src-tauri/target/release
        run: |
          $res = (Resolve-Path ..\..\..\src-tauri).Path
          New-Item -ItemType Directory -Force -Path .\extensions | Out-Null
          Copy-Item -Recurse -Force "$res\extensions\*" .\extensions\
          function Probe($kind, $on) {
            $out = Join-Path $env:RUNNER_TEMP ("probe-" + $kind + "-" + $on + ".txt")
            Remove-Item $out -ErrorAction SilentlyContinue
            $env:MUSLIM_PROBE = $kind
            $env:MUSLIM_PROBE_OUT = $out
            if ($on) { $env:MUSLIM_ADBLOCK = '1' } else { Remove-Item Env:MUSLIM_ADBLOCK -ErrorAction SilentlyContinue }
            $p = Start-Process -FilePath .\muslim-todo.exe -PassThru
            for ($i = 0; $i -lt 60 -and -not (Test-Path $out); $i++) { Start-Sleep -Seconds 1 }
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            Start-Sleep -Seconds 3
            if (Test-Path $out) { (Get-Content $out -Raw).Trim() } else { 'no answer' }
          }
          $off = Probe 'adblock' $false
          $on = Probe 'adblock' $true
          Write-Host "blocker off: $off / blocker on: $on"
          if ($off -ne 'loaded' -or $on -ne 'blocked') { Write-Error "The ad blocker does not work as it should"; exit 1 }

      # The website in the window reaches the library on this computer: its commands and its files.
      - name: Library on this computer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: desktop/src-tauri/target/release
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'probe-shamela.txt'
          $env:MUSLIM_PROBE = 'shamela'
          $env:MUSLIM_PROBE_OUT = $out
          $p = Start-Process -FilePath .\muslim-todo.exe -PassThru
          for ($i = 0; $i -lt 60 -and -not (Test-Path $out); $i++) { Start-Sleep -Seconds 1 }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          $r = if (Test-Path $out) { (Get-Content $out -Raw).Trim() } else { 'no answer' }
          Write-Host "library: $r"
          if (-not ($r -like 'cmd-ok*|file-ok')) { Write-Error "The website cannot reach the library on this computer"; exit 1 }
          # Download the smallest shelf from the release and read a book of it.
          $out = Join-Path $env:RUNNER_TEMP 'probe-install.txt'
          $env:MUSLIM_PROBE = 'install'
          $env:MUSLIM_PROBE_OUT = $out
          $p = Start-Process -FilePath .\muslim-todo.exe -PassThru
          for ($i = 0; $i -lt 240 -and -not (Test-Path $out); $i++) { Start-Sleep -Seconds 1 }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          $r = if (Test-Path $out) { (Get-Content $out -Raw).Trim() } else { 'no answer' }
          Write-Host "install: $r"
          if (-not ($r -match '^installed-\d+\|true\|bytes-[1-9]')) { Write-Error "A shelf could not be downloaded and read"; exit 1 }

      - name: Collect the installers
        run: |
          mkdir -p ../out
          if [ "$RUNNER_OS" = Windows ]; then
            cp src-tauri/target/release/bundle/nsis/*.exe ../out/Muslim-Activity-Windows-setup.exe
            cp src-tauri/target/release/bundle/nsis/*.exe.sig ../out/Muslim-Activity-Windows-setup.exe.sig
            cp src-tauri/target/release/bundle/msi/*.msi ../out/Muslim-Activity-Windows.msi
            cp ../desktop-windows.png ../out/ || true
          else
            cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg ../out/Muslim-Activity-macOS.dmg
            cp src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz ../out/Muslim-Activity-macOS.app.tar.gz
            cp src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig ../out/Muslim-Activity-macOS.app.tar.gz.sig
          fi
          ls -la ../out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ runner.os }}
          path: out/

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true

      - name: Publish (not as the latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f desktop-windows.png
          notes="مهام المسلم للكمبيوتر — Windows: Muslim-Activity-Windows-setup.exe · macOS: Muslim-Activity-macOS.dmg"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" Muslim-Activity-* --clobber
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" Muslim-Activity-* --title "Muslim Activity for desktop $GITHUB_REF_NAME" --notes "$notes" --latest=false
          fi

      # What the installed apps read to find this version: latest.json in the desktop-updates release.
      - name: Tell the installed apps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#desktop-v}"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          jq -n --arg v "$ver" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             --rawfile ws Muslim-Activity-Windows-setup.exe.sig --rawfile ms Muslim-Activity-macOS.app.tar.gz.sig             --arg wu "$base/Muslim-Activity-Windows-setup.exe" --arg mu "$base/Muslim-Activity-macOS.app.tar.gz"             '{version: $v, notes: "مهام المسلم للكمبيوتر \($v)", pub_date: $d, platforms: {
              "windows-x86_64": {signature: $ws, url: $wu},
              "darwin-aarch64": {signature: $ms, url: $mu},
              "darwin-x86_64": {signature: $ms, url: $mu}}}' > latest.json
          cat latest.json
          gh release view desktop-updates --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||             gh release create desktop-updates --repo "$GITHUB_REPOSITORY" --title "Desktop app updates" --notes "latest.json for the desktop app's updater; the installers are in the desktop-v* releases." --latest=false
          gh release upload desktop-updates --repo "$GITHUB_REPOSITORY" latest.json --clobber
          # The same installers under fixed names there: the install page links to them.
          gh release upload desktop-updates --repo "$GITHUB_REPOSITORY" Muslim-Activity-Windows-setup.exe Muslim-Activity-Windows.msi Muslim-Activity-macOS.dmg --clobber
