# Publishes the website to GitHub Pages, with the latest Android app next to it
# at /muslim-todo-list.apk so phones download it directly from the site.
name: Website

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Android app']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The offline checks (tools/test_*.mjs, tools/check_i18n.mjs); check_sources.mjs reaches the outside
  # services and runs daily in sources.yml, the Python tests reach the live Supabase project: neither here.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: |
          for t in tools/test_*.mjs; do echo "== $t"; node "$t"; done
          node tools/check_i18n.mjs

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir _site
          cp -r index.html install.html privacy.html manifest.webmanifest sw.js live.json tv.html .nojekyll README.md en icons fonts js sounds quran books mushafs _site/
          gh release download --repo "$GITHUB_REPOSITORY" --pattern muslim-todo-list.apk --dir _site || echo "No release yet"
          # The app's "check for updates" reads this: the release whose APK is published here.
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || echo v0.0.0)
          echo "{\"version\":\"${tag#v}\"}" > _site/version.json
          cat _site/version.json
          ls -la _site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
