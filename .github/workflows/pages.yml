# Publishes the website to GitHub Pages, with the latest Android app next to it
# at /muslim-todo-list.apk so phones download it directly from the site.
name: Website

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Android app']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Collect the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir _site
          cp -r index.html install.html privacy.html manifest.webmanifest sw.js live.json tv.html .nojekyll README.md en icons fonts js sounds quran _site/
          gh release download --repo "$GITHUB_REPOSITORY" --pattern muslim-todo-list.apk --dir _site || echo "No release yet"
          # The app's "check for updates" reads this: the release whose APK is published here.
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || echo v0.0.0)
          echo "{\"version\":\"${tag#v}\"}" > _site/version.json
          cat _site/version.json
          ls -la _site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
